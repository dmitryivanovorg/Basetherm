[package]
name = "basetherm-wasm-api"
version = "2.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Threads in the ADI sweeps. On wasm32 this needs the nightly atomics build (scripts/build-wasm.sh).
parallel = ["basetherm-basement/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
basetherm-basement = { path = "../basement", default-features = false }
basetherm-climate-epw = { path = "../climate-epw", default-features = false }
basetherm-materials = { path = "../materials" }
basetherm-surface = { path = "../surface", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true }
