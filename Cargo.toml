[workspace]
resolver = "2"
members = ["crates/grid", "crates/materials", "crates/freezing", "crates/adi", "crates/basement", "crates/bc", "crates/conduction", "crates/mg", "crates/surface", "crates/farfield", "crates/periodic", "crates/climate-epw", "crates/fluxes", "crates/wasm-api", "crates/bench", "crates/validation-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Validation runs solve 100k+ cell systems; keep test builds fast (debug assertions stay on).
[profile.test]
opt-level = 3
